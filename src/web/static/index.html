<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Asistente para vehículo Jarvis On Road">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/main.css">
  <title>Jarvis On Road</title>
</head>
<body>
  <header>
    <div class="header-content">
      <div>
        <h1>Jarvis On Road</h1>
        <div class="subtitle">Asistente de vehículo</div>
      </div>
      <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0;">
        <span id="connection-dot" class="status-dot connecting" aria-hidden="true"></span>
        <span id="connection-text" class="subtitle" style="margin:0;">Conectando…</span>
      </div>
    </div>
  </header>

  <main>
    <section id="tab-dashboard" class="tab active" aria-label="Panel principal">
      <div class="status-bar">
        <div id="obd-chip" class="status-chip">
          OBD-II
          <strong>Desconocido</strong>
        </div>
        <div id="alert-chip" class="status-chip ok">
          Alertas
          <strong>Sin alertas</strong>
        </div>
        <div id="dtc-chip" class="status-chip ok">
          Averías
          <strong>Sin DTCs</strong>
        </div>
      </div>

      <div id="obd-grid" class="card-grid"></div>

      <div id="last-update" class="empty-state">Esperando datos…</div>
    </section>

    <section id="tab-leds" class="tab" aria-label="Control de luces LED">
      <div id="led-section" class="led-section">
        <h2>Luces LED</h2>
        <div class="led-row">
          <button id="led-on" class="btn on" type="button">Encender</button>
          <button id="led-off" class="btn off" type="button">Apagar</button>
        </div>
        <div class="led-row">
          <label for="led-color">Color</label>
          <input id="led-color" type="color" value="#ffffff" aria-label="Color LED">
        </div>
        <div class="led-row">
          <label for="led-brightness">Brillo</label>
          <input id="led-brightness" type="range" min="0" max="100" value="100" aria-label="Brillo LED">
        </div>
        <div class="led-row">
          <label for="led-auto">Automático (amanecer/atardecer)</label>
          <input id="led-auto" type="checkbox" aria-label="Modo automático LED">
        </div>
        <div id="led-auto-info" class="led-status"></div>
        <div id="led-status" class="led-status">Cargando estado…</div>
      </div>
    </section>

    <section id="tab-alerts" class="tab" aria-label="Alertas y diagnóstico">
      <div class="panel">
        <h2>Alertas activas</h2>
        <div id="alerts-list">
          <div class="empty-state">No hay alertas activas</div>
        </div>
      </div>

      <div class="panel">
        <h2>Códigos de avería</h2>
        <div id="dtcs-list">
          <div class="empty-state">No hay códigos de avería</div>
        </div>
      </div>
    </section>
  </main>

  <nav aria-label="Navegación principal">
    <ul>
      <li>
        <button data-tab="tab-dashboard" class="active" type="button" aria-label="Panel principal">
          <span>Panel</span>
        </button>
      </li>
      <li>
        <button data-tab="tab-leds" type="button" aria-label="Luces LED">
          <span>LEDs</span>
        </button>
      </li>
      <li>
        <button data-tab="tab-alerts" type="button" aria-label="Diagnóstico">
          <span>Avisos</span>
        </button>
      </li>
      <li>
        <button id="install-btn" type="button" aria-label="Instalar aplicación">
          <span>Instalar</span>
        </button>
      </li>
    </ul>
  </nav>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
