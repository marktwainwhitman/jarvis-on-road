services:
  jarvis:
    build: .
    container_name: jarvis-on-road
    restart: unless-stopped
    # network_mode: host hace que el contenedor comparta la pila TCP del host;
    # no es necesario (ni efectivo) publicar puertos.
    volumes:
      - .:/app
      # LEDs BLE (ELK-BLEDOM): bleak usa BlueZ a través de D-Bus. El puerto
      # serie /dev/rfcomm0 para el OBD-II se crea en el host (vía
      # scripts/obd_rfcomm_bind.sh o un servicio systemd) y el contenedor
      # lo ve gracias a privileged: true; no se monta explicitamente para
      # evitar que docker compose falle si aun no existe al arrancar.
      - /var/run/dbus:/var/run/dbus
    stdin_open: true
    tty: true
    # privileged permite ver el adaptador Bluetooth y los dispositivos de
    # serie dinamicos (/dev/rfcomm*) sin necesidad de montarlos concretos
    # al inicio. En produccion se deberia reducir a cap_add/devices concretos
    # una vez validado el hardware.
    privileged: true
    network_mode: host  # imprescindible para BLE: BlueZ identifica el
                         # adaptador por el nombre de host/red del sistema.
    environment:
      - OBD_MOCK=false
      - OBD_PORT=/dev/rfcomm0
      # MAC del adaptador OBD-II Bluetooth del coche. El binding real a
      # /dev/rfcomm0 lo hace scripts/obd_rfcomm_bind.sh en el host (que ya
      # usa esta misma MAC como valor por defecto).
      - OBD_BT_MAC=04:25:E8:5B:01:EB
      - OBD_PIDS=RPM,SPEED,COOLANT_TEMP,ENGINE_LOAD,THROTTLE_POS,INTAKE_TEMP,MAF,INTAKE_PRESSURE,SHORT_FUEL_TRIM_1,LONG_FUEL_TRIM_1,FUEL_PRESSURE,CONTROL_MODULE_VOLTAGE,TIMING_ADVANCE,EGR_ERROR,RUN_TIME,FUEL_LEVEL,O2_B1S1,O2_B1S2,CATALYST_TEMP_B1S1,CATALYST_TEMP_B1S2,STATUS
      - TZ=Europe/Madrid
      - JARVIS_HOST=0.0.0.0
      - JARVIS_PORT=8000
      - JARVIS_LOG_LEVEL=info
      - LED_ENABLED=true
      - LED_MAC=BE:27:C8:00:C4:D9
      # La base de datos SQLite vive en ./data, que ya persiste en el host
      # gracias al bind mount ".:/app" de arriba.
      - JARVIS_DB_PATH=data/jarvis.db
      - JARVIS_DB_RETENTION_DAYS=30
      # Automatización día/noche de los LEDs (amanecer/atardecer calculado
      # para la zona Huelva-Sevilla-Cádiz; margen de error ~30 min).
      - LED_AUTO_MODE=false
      - LED_AUTO_LAT=37.2
      - LED_AUTO_LON=-6.4
      - LED_AUTO_TZ=Europe/Madrid
      # Encender 30 min antes del atardecer real (el apagado sigue
      # ocurriendo en el amanecer real).
      - LED_AUTO_PRE_LIGHT_MINUTES=30.0
