services:
  jarvis:
    build: .
    container_name: jarvis-on-road
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # LEDs BLE (ELK-BLEDOM): bleak usa BlueZ a través de D-Bus. El puerto
      # serie /dev/rfcomm0 para el OBD-II se crea en el host (vía
      # scripts/obd_rfcomm_bind.sh o un servicio systemd) y el contenedor
      # lo ve gracias a privileged: true; no se monta explicitamente para
      # evitar que docker compose falle si aun no existe al arrancar.
      - /var/run/dbus:/var/run/dbus
    stdin_open: true
    tty: true
    # privileged permite ver el adaptador Bluetooth y los dispositivos de
    # serie dinamicos (/dev/rfcomm*) sin necesidad de montarlos concretos
    # al inicio. En produccion se deberia reducir a cap_add/devices concretos
    # una vez validado el hardware.
    privileged: true
    network_mode: host  # imprescindible para BLE: BlueZ identifica el
                         # adaptador por el nombre de host/red del sistema.
    environment:
      - OBD_MOCK=false
      - OBD_PORT=/dev/rfcomm0
      - JARVIS_HOST=0.0.0.0
      - JARVIS_PORT=8000
      - JARVIS_LOG_LEVEL=info
      - LED_ENABLED=true
      - LED_MAC=BE:27:C8:00:C4:D9
